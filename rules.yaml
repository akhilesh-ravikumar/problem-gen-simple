# Everything the generator needs to know, in one place. Edit this file to change its behaviour.

# Which model each step uses. Creative steps get a stronger model; judging and checking stay cheap.
models:
  research: claude-haiku-5-5
  brainstorm: claude-haiku-5-5
  pick: claude-haiku-5-5
  write: claude-haiku-5-5
  check: claude-haiku-5-5

ideas_per_run: 5 

search:
  queries: 3 
  results_per_query: 3     # results asked for per search
  max_results: 5           # total results Claude reads, the most relevant ones across all searches
  snippet_chars: 300        

levels:
  L1:
    name: Awareness
    tasks: 2-3 small pieces of work
    words: [400, 750]
    guidance: >-
      Fully guided. State every rule, threshold and fallback exactly, and give a sample for each task.
    trap: At most one, and the statement names it and says how to handle it.
  L2:
    name: Working Knowledge
    tasks: 3-4 pieces of work
    words: [550, 850]
    guidance: >-
      Guided. State each task's rules, thresholds, fallbacks and exact outputs. The candidate decides how
      to implement them.
    trap: Exactly one. The statement mentions the case but not how to handle it.
  L3:
    name: Skilled Practice
    tasks: 3-5 pieces of work, possibly across more than one file or service
    words: [500, 1050]
    guidance: >-
      Unguided. State the goal, every interface and the exact expected outputs, but not the decision
      rules or the approach: the candidate works them out from the provided code and data.
    trap: One or two, discoverable only from the provided code, data or hidden tests.

# ---------------------------------------------------------------------------
# Variety. When --area or --platform is not given, the script picks one at random.
# An area that names an AWS service (Bedrock, SageMaker, AWS) always gets the aws platform.
areas:
  - RAG pipelines (chunking, retrieval, reranking)
  - Embeddings and vector search
  - LLM evaluation and LLM-as-judge
  - Agents and tool use
  - Structured outputs and function calling
  - Fine-tuning data preparation and training configuration (no real training jobs)
  - Guardrails, safety and prompt-injection defence
  - Multimodal AI (vision, OCR, speech-to-text)
  - Cost and latency optimisation (caching, batching, model routing)
  - Monitoring, tracing and drift detection for LLM applications
  - Amazon Bedrock Knowledge Bases and Bedrock Agents
  - Amazon SageMaker model deployment (endpoints, serverless inference)

platforms:
  offline:
    description: >-
      Runs locally in Python with no external services. Any model replies, embeddings or predictions the
      task needs are provided as files.
    setup: >-
      No API keys needed: this exercise is fully offline. No OPENAI_API_KEY or proxy gateway is required.
  openai:
    description: >-
      Calls OpenAI (gpt-4o-mini for chat, text-embedding-3-small for embeddings) through the company proxy.
      Hidden tests replace the model with scripted replies.
    setup: |-
      OpenAI Configuration: OpenAI is used as the LLM provider, with the API key read from the OPENAI_API_KEY environment variable. Use the gpt-4o-mini chat model and, where embeddings are needed, the text-embedding-3-small embedding model. Route all calls through the proxy gateway below:

      🔗 Proxy URL: https://llmgateway-lms.tekstac.com/v1

      ```python
      client = OpenAI(
          api_key=api_key,
          base_url="https://llmgateway-lms.tekstac.com/v1",
      )
      ```
  aws:
    description: >-
      A temporary AWS account is provisioned for the candidate, with AWS services including Amazon Bedrock,
      SageMaker, S3, Lambda and IAM available. The candidate can use the console and the AWS CLI / boto3.
      Time and resources on the account are tracked and limited server-side, and the grader inspects it after submission,
      so every resource the grader checks needs an exact name, region and settings. No real training jobs.
    setup: |-
      AWS Configuration: A temporary AWS account has been provisioned for you. Credentials are already configured in the terminal, so the AWS CLI and boto3 work without extra setup, and you can also use the AWS Management Console. Create every resource with the exact names, region and settings given in this statement: the automated evaluation inspects your account after you submit.

      Resources on this account are tracked and limited. Use the smallest instance types that work, avoid long-running jobs, and delete anything you create that the task does not ask you to keep.

# Kinds of material the candidate works with. Each brainstormed idea uses a different one.
materials:
  - Tables (CSV files or a SQLite database)
  - JSONL datasets
  - A small set of documents (Markdown, text or PDF)
  - Application logs or traces
  - Chat transcripts
  - Images or scanned documents
  - Configuration files (IAM policies, CloudFormation, prompt templates)

# Kinds of work. Each brainstormed idea uses a different one.
task_shapes:
  - Fix something broken whose bug shows up as a business symptom
  - Extend existing code by following its pattern, plus one awkward new case
  - Build a small end-to-end pipeline (load, transform, decide, report)
  - Make fragile code robust to messy real-world input without changing its interface
  - Write a validator or guard that blocks bad data or bad model output
  - Analyse logs, traces or tables and produce a decision or report
  - Implement a scorer or evaluator with exact, explainable results
  - Compare options against constraints (cost, latency, quality) and pick one
  - Configure and wire up cloud resources to meet a stated requirement
  - Migrate data, prompts or configuration from an old format to a new one

avoid:
  - Generic settings with no named organisation, users or stakes
  - To-do apps, library systems, shopping carts, calculators, puzzles, CRUD with no twist
  - Tasks that a single LLM prompt could solve without running or inspecting the provided material

# How every statement should be written (replaces reference examples)
style_guide:
  - Name everything exactly - files, functions, CLI commands, AWS resources, output keys - so hidden tests can find them.
  - Give exact outputs - types, allowed values, casing, rounding, order - plus one sample input and its exact output.
  - Tell a concrete story - a fictional organisation, the people involved, real numbers, what went wrong and what it cost. Never name a real company.
  - Describe the provided material precisely - file names, columns or fields, how many records - so it can be generated later.
  - Hint exactly as much as the level allows; never explain the trap beyond that.
  - Anything that depends on a model's reply must be gradable with scripted replies or structure checks, never on wording.
  - For AWS, state the region and every resource the grader will inspect, with its name and required settings.
  - Plain, direct, second person. No marketing language.

# ---------------------------------------------------------------------------
# The house format. Claude fills the <...> parts and keeps the [[...]] markers;
# the script replaces the markers with the fixed text below.
template: |
  # <Title, project-style, e.g. "Cold Chain Alert Fixer">

  ## Description
  <1-2 sentences: what to build or fix, and any key tooling rule>

  ## 📋 Instructions
  [[INSTRUCTIONS]]

  ## 🎯 Objective
  <One paragraph: the organisation, the real-world situation, what is going wrong and what it costs, what to build>

  ## 📚 <Area name> Concepts You'll Practice
  - **<Concept>** — <1-2 sentences tying it to this problem>   (4-6 concepts)

  ## Your Task
  <What to implement, fix or configure, in whatever shape the idea needs. For each piece give its exact name
   (function signature, file, command or AWS resource) and exact expected output, as much of the rules as
   the level allows, and any extra contract rules.>
  Sample:
  ```<language>
  <a sample input and its exact output>
  ```

  ## Environment Setup
  File Structure:
  ```
  <project_folder>/
  ├── <provided file>  # <contents> (fixed, do not modify)
  └── <file with TODOs>  # <what to implement>
  ```
  Open VS Code: Open the project folder in VS Code and launch the integrated terminal (Terminal → New Terminal).

  <Any packages or provided data the candidate needs; for AWS, the region and resources to create>

  [[SETUP]]

  ## How to Run
  ```bash
  <the command, e.g. python main.py>
  ```
  <One or two sentences starting "This ..." saying what it does and prints>

  ## How to Evaluate
  [[HOW_TO_EVALUATE]]

# The section headings that must appear, in this order (check() in generate.py)
sections: [Description, Instructions, Objective, Concepts You'll Practice, Your Task, Environment Setup, How to Run, How to Evaluate]

# Fixed text that replaces the [[...]] markers
fixed_text:
  INSTRUCTIONS: >-
    Use the provided template code as the starting point. Implement your solution only within the TODO
    blocks, and do not modify the project structure, file names, or function signatures. The automated
    evaluation uses this template to assess your code, so any structural changes may cause your submission
    to fail evaluation.
  HOW_TO_EVALUATE: |-
    To evaluate your solution and view the score:

    Click the "t" icon on the left side of the VS Code editor, select Evaluate to run the automated evaluation, and view the evaluation score and results once the evaluation is complete.
